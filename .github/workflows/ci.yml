        run: >-
          python benchmarks/run_libjpeg_capacity_benchmark.py freeze
          --discovery .benchmark/m11-3-discovery
          --frozen .benchmark/m11-3-frozen
      - name: Require caller/callee alias recovery and fixed negative
        run: >-
          python benchmarks/run_libjpeg_capacity_benchmark.py evaluate
          --frozen .benchmark/m11-3-frozen
          --oracle benchmarks/oracles/libjpeg-turbo-issue-387.toml
          --scan-manifest benchmarks/libjpeg-turbo-blind-scan.toml
          --vulnerable-repo .benchmark/libjpeg-vulnerable
          --fixed-repo .benchmark/libjpeg-fixed
          --output .benchmark/m11-3-evaluation

  m11-5-libcue-specialist:
    name: M11.5 libcue specialist-preservation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned vulnerable libcue tree
        uses: actions/checkout@v6
        with:
          repository: lipnitsk/libcue
          ref: 1b0f3917b8f908c81bb646ce42f29cf7c86443a1
          path: .benchmark/libcue-m11-5-vulnerable
      - name: Checkout pinned fixed libcue tree
        uses: actions/checkout@v6
        with:
          repository: lipnitsk/libcue
          ref: cfb98a060fd79dbc3463d85f0f29c3c335dfa0ea
          path: .benchmark/libcue-m11-5-fixed
      - name: Discover without oracle input
        run: >-
          python benchmarks/run_libcue_specialist_benchmark.py discover
          --repo .benchmark/libcue-m11-5-vulnerable
          --scan-manifest benchmarks/libcue-blind-scan.toml
          --output .benchmark/m11-5-discovery
          --mode deterministic
      - name: Freeze discovery artifacts
        run: >-
          python benchmarks/run_libcue_specialist_benchmark.py freeze
          --discovery .benchmark/m11-5-discovery
          --frozen .benchmark/m11-5-frozen
      - name: Prepare verified generated-parser images
        run: |
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/libcue-m11-5-vulnerable \
            --run-dir .benchmark/libcue-m11-5-vulnerable-prepared
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/libcue-m11-5-fixed \
            --run-dir .benchmark/libcue-m11-5-fixed-prepared
      - name: Require both libcue specialists within the locked budget
        run: >-
          python benchmarks/run_libcue_specialist_benchmark.py evaluate
          --frozen .benchmark/m11-5-frozen
          --oracle benchmarks/oracles/libcue-cve-2023-43641.toml
          --scan-manifest benchmarks/libcue-blind-scan.toml
          --vulnerable-repo .benchmark/libcue-m11-5-vulnerable
          --fixed-repo .benchmark/libcue-m11-5-fixed
          --output .benchmark/m11-5-evaluation
          --run-reproduction
          --vulnerable-prepare-run .benchmark/libcue-m11-5-vulnerable-prepared
          --fixed-prepare-run .benchmark/libcue-m11-5-fixed-prepared

  m11-7-cjson-cursor:
    name: M11.7 cJSON cursor-state recovery gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned vulnerable cJSON tree
        uses: actions/checkout@v6
        with:
          repository: DaveGamble/cJSON
          ref: 98f9eb0412067a852ec107c68e49180fe4e472dc
          path: .benchmark/cjson-m11-7-vulnerable
      - name: Checkout pinned fixed cJSON tree
        uses: actions/checkout@v6
        with:
          repository: DaveGamble/cJSON
          ref: 3ef4e4e730e5efd381be612df41e1ff3f5bb3c32
          path: .benchmark/cjson-m11-7-fixed
      - name: Discover without oracle input
        run: >-
          python benchmarks/run_cjson_cursor_benchmark.py discover
          --repo .benchmark/cjson-m11-7-vulnerable
          --scan-manifest benchmarks/cjson-blind-scan.toml
          --output .benchmark/m11-7-discovery
          --mode deterministic
      - name: Freeze discovery artifacts
        run: >-
          python benchmarks/run_cjson_cursor_benchmark.py freeze
          --discovery .benchmark/m11-7-discovery
          --frozen .benchmark/m11-7-frozen
      - name: Prepare verified source-baked reproduction images
        run: |
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/cjson-m11-7-vulnerable \
            --run-dir .benchmark/cjson-m11-7-vulnerable-prepared \
            --cmake-option ENABLE_CJSON_TEST=OFF
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/cjson-m11-7-fixed \
            --run-dir .benchmark/cjson-m11-7-fixed-prepared \
            --cmake-option ENABLE_CJSON_TEST=OFF
      - name: Require cursor target, Parser-State admission, and differential proof
        run: >-
          python benchmarks/run_cjson_cursor_benchmark.py evaluate
          --frozen .benchmark/m11-7-frozen
          --oracle benchmarks/oracles/cjson-issue-800.toml
          --scan-manifest benchmarks/cjson-blind-scan.toml
          --vulnerable-repo .benchmark/cjson-m11-7-vulnerable
          --fixed-repo .benchmark/cjson-m11-7-fixed
          --output .benchmark/m11-7-evaluation
          --run-reproduction
          --vulnerable-prepare-run .benchmark/cjson-m11-7-vulnerable-prepared
          --fixed-prepare-run .benchmark/cjson-m11-7-fixed-prepared

  m12-1-autotools-prepared-build:
    name: M12.1 Autotools verified preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned Autotools project
        uses: actions/checkout@v6
        with:
          repository: stephane/libmodbus
          ref: b4ef4c17d618eba0adccc4c7d9e9a1ef809fc9b6
          path: .benchmark/libmodbus-autotools
      - name: Require verified offline Autotools preparation
        run: |
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/libmodbus-autotools \
            --run-dir .benchmark/libmodbus-autotools-prepared
          python -m benchmarks.m12.prepared_build verify \
            --run-dir .benchmark/libmodbus-autotools-prepared

  m11-5-release-matrix:
    name: Protected detection release matrix
    if: ${{ always() }}
    needs:
      - m9-zlib-regression
      - m11-2-libwebp-blind
      - m11-3-libjpeg-alias-blind
      - m11-5-libcue-specialist
      - m11-7-cjson-cursor
      - m12-1-autotools-prepared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Require every protected detection gate to pass
        env:
          ZLIB_STATUS: ${{ needs['m9-zlib-regression'].result }}
          LIBWEBP_STATUS: ${{ needs['m11-2-libwebp-blind'].result }}
          LIBJPEG_STATUS: ${{ needs['m11-3-libjpeg-alias-blind'].result }}
          LIBCUE_STATUS: ${{ needs['m11-5-libcue-specialist'].result }}
          CJSON_STATUS: ${{ needs['m11-7-cjson-cursor'].result }}
          AUTOTOOLS_STATUS: ${{ needs['m12-1-autotools-prepared-build'].result }}
        run: |
          test "${AUTOTOOLS_STATUS}" = success
          python benchmarks/run_detection_release_matrix.py evaluate \
            --status m9-zlib-regression=${ZLIB_STATUS} \
            --status m11-2-libwebp-blind=${LIBWEBP_STATUS} \
            --status m11-3-libjpeg-alias-blind=${LIBJPEG_STATUS} \
            --status m11-5-libcue-specialist=${LIBCUE_STATUS} \
            --status m11-7-cjson-cursor=${CJSON_STATUS}
