name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - "docs/milestones/m13-*"
      - "src/vulnhunt_agent/macos/**"
      - "src/vulnhunt_agent/reporting/apple_cve.py"
      - "tests/test_m13_*"
      - "tools/macos/**"
  pull_request:
    paths-ignore:
      - "docs/milestones/m13-*"
      - "src/vulnhunt_agent/macos/**"
      - "src/vulnhunt_agent/reporting/apple_cve.py"
      - "tests/test_m13_*"
      - "tools/macos/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests benchmarks
      - name: Type check
        run: python -m mypy
      - name: Tests with coverage
        run: >-
          python -m pytest
          --cov=vulnhunt_agent
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=45

  docker-sandbox:
    name: Hardened Docker sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Pull test runtime
        run: |
          docker pull python:3.12-slim
          docker pull gcc:13-bookworm
      - name: Run real sandbox escape contract
        env:
          VULNHUNT_RUN_DOCKER_TESTS: "1"
        run: python -m pytest tests/test_docker_sandbox_integration.py

  m8-libcue-regression:
    name: M8 libcue regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout vulnerable libcue revision
        uses: actions/checkout@v6
        with:
          repository: lipnitsk/libcue
          ref: 1b0f3917b8f908c81bb646ce42f29cf7c86443a1
          path: .benchmark/libcue-vulnerable
      - name: Require vulnerable sink coverage and at least 60 percent fewer sessions
        run: >-
          python benchmarks/run_c_graph_benchmark.py
          --repo .benchmark/libcue-vulnerable
          --expect vulnerable
      - name: Checkout fixed libcue revision
        uses: actions/checkout@v6
        with:
          repository: lipnitsk/libcue
          ref: cfb98a060fd79dbc3463d85f0f29c3c335dfa0ea
          path: .benchmark/libcue-fixed
      - name: Reject the fixed revision as vulnerable
        run: >-
          python benchmarks/run_c_graph_benchmark.py
          --repo .benchmark/libcue-fixed
          --expect fixed

  m9-zlib-regression:
    name: M9 zlib CVE-2023-45853 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned fixed zlib revision
        uses: actions/checkout@v6
        with:
          repository: madler/zlib
          ref: 73331a6a0481067628f065ffe87bb1d8f787d10c
          fetch-depth: 0
          path: .benchmark/zlib-fixed
      - name: Require the 16-bit guards to lower the target allocation risk
        run: |
          python benchmarks/run_zlib_cve_benchmark.py \
            --repo .benchmark/zlib-fixed \
            --expect fixed 2>&1 | tee /tmp/zlib-fixed-gate.log
          status=${PIPESTATUS[0]}
          if [[ ${status} -ne 0 ]]; then
            message=$(tail -n 20 /tmp/zlib-fixed-gate.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=zlib fixed regression gate failed::${message}"
            exit "${status}"
          fi
      - name: Checkout a second pinned zlib worktree
        uses: actions/checkout@v6
        with:
          repository: madler/zlib
          ref: 73331a6a0481067628f065ffe87bb1d8f787d10c
          fetch-depth: 0
          path: .benchmark/zlib-vulnerable
      - name: Materialize the vulnerable source as a revert of the pinned fix
        run: >-
          git -C .benchmark/zlib-vulnerable
          -c user.name=VulnHunt-CI
          -c user.email=vulnhunt-ci@example.invalid
          revert --no-edit 73331a6a0481067628f065ffe87bb1d8f787d10c
      - name: Verify CMake preparation for both protected revisions
        run: |
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/zlib-vulnerable \
            --run-dir .benchmark/zlib-vulnerable-prepared
          python -m benchmarks.m12.prepared_build prepare \
            --repo .benchmark/zlib-fixed \
            --run-dir .benchmark/zlib-fixed-prepared
      - name: Require change-focused target coverage and bounded context
        run: |
          python benchmarks/run_zlib_cve_benchmark.py \
            --repo .benchmark/zlib-vulnerable \
            --expect vulnerable \
            --base-ref 73331a6a0481067628f065ffe87bb1d8f787d10c \
            --head-ref HEAD 2>&1 | tee /tmp/zlib-vulnerable-gate.log
          status=${PIPESTATUS[0]}
          if [[ ${status} -ne 0 ]]; then
            message=$(tail -n 20 /tmp/zlib-vulnerable-gate.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=zlib vulnerable regression gate failed::${message}"
            exit "${status}"
          fi

  m10-libtiff-blind-regression:
    name: M10 LibTIFF blind deterministic gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned vulnerable and fixed LibTIFF trees
        run: |
          mkdir -p .benchmark
          git clone --filter=blob:none --no-checkout https://gitlab.com/libtiff/libtiff.git .benchmark/libtiff-vulnerable
          git -C .benchmark/libtiff-vulnerable checkout cb88a5b6bf1757060ec4d50055fa852fd7830cfe
          git -C .benchmark/libtiff-vulnerable worktree add ../libtiff-fixed 6e2dac5f904496d127c92ddc4e56eccfca25c2ee
      - name: Discover without oracle input
        run: >-
          python benchmarks/run_libtiff_blind_benchmark.py discover
          --repo .benchmark/libtiff-vulnerable
          --scan-manifest benchmarks/libtiff-blind-scan.toml
          --output .benchmark/m10-discovery
          --mode deterministic
      - name: Freeze discovery artifacts
        run: >-
          python benchmarks/run_libtiff_blind_benchmark.py freeze
          --discovery .benchmark/m10-discovery
          --frozen .benchmark/m10-frozen
      - name: Evaluate only after freeze
        run: >-
          python benchmarks/run_libtiff_blind_benchmark.py evaluate
          --frozen .benchmark/m10-frozen
          --oracle benchmarks/oracles/libtiff-cve-2023-41175.toml
          --scan-manifest benchmarks/libtiff-blind-scan.toml
          --vulnerable-repo .benchmark/libtiff-vulnerable
          --fixed-repo .benchmark/libtiff-fixed
          --output .benchmark/m10-evaluation

  m11-libexpat-operational:
    name: M11 libexpat credential-free operational gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned live libexpat tree
        uses: actions/checkout@v6
        with:
          repository: libexpat/libexpat
          ref: 7d93af0965eee44fde42d9e9ec8761ae2894e8e8
          fetch-depth: 0
          path: .benchmark/libexpat-live
      - name: Run deterministic tier without provider credentials
        env:
          OPENAI_API_KEY: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: >-
          python benchmarks/run_libexpat_live_benchmark.py deterministic
          --repo .benchmark/libexpat-live
          --manifest benchmarks/libexpat-live-scan.toml
          --output .benchmark/m11-libexpat-operational
      - name: Verify closed operational artifacts
        run: >-
          python benchmarks/run_libexpat_live_benchmark.py verify
          --output .benchmark/m11-libexpat-operational

  m11-2-libwebp-blind:
    name: M11.2 libwebp blind capacity gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Configure default model catalog
        run: cp settings.example.toml settings.toml
      - name: Checkout pinned vulnerable libwebp tree
        uses: actions/checkout@v6
        with:
          repository: webmproject/libwebp
          ref: 7ba44f80f3b94fc0138db159afea770ef06532a0
          path: .benchmark/libwebp-vulnerable
      - name: Checkout pinned fixed libwebp tree
        uses: actions/checkout@v6
        with:
          repository: webmproject/libwebp
          ref: 902bc9190331343b2017211debcec8d2ab87e17a
          path: .benchmark/libwebp-fixed
      - name: Discover without oracle input
        run: >-
          python benchmarks/run_libwebp_capacity_benchmark.py discover
          --repo .benchmark/libwebp-vulnerable
          --scan-manifest benchmarks/libwebp-blind-scan.toml
          --output .benchmark/m11-2-discovery
          --mode deterministic
      - name: Freeze discovery artifacts
        run: >-
          python benchmarks/run_libwebp_capacity_benchmark.py freeze
          --discovery .benchmark/m11-2-discovery
          --frozen .benchmark/m11-2-frozen
      - name: Require top-six rank and bounded cross-file context
        run: >-
          python benchmarks/run_libwebp_capacity_benchmark.py evaluate
          --frozen .benchmark/m11-2-frozen
          --oracle benchmarks/oracles/libwebp-cve-2023-4863.toml
          --scan-manifest benchmarks/libwebp-blind-scan.toml
          --vulnerable-repo .benchmark/libwebp-vulnerable
          --fixed-repo .benchmark/libwebp-fixed
          --output .benchmark/m11-2-evaluation

  m11-3-libjpeg-alias-blind:
