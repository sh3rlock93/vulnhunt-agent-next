name: M15 Binary Regression Gate

on:
  push:
    branches:
      - main
      - "agent/m1[345]-**"
    paths:
      - ".github/workflows/m15-binary-regression-ci.yml"
      - "benchmarks/m15_blind/**"
      - "benchmarks/run_m15_binary_regression_gate.py"
      - "docs/milestones/m15-binary-static-precision.md"
      - "src/vulnhunt_agent/macos/binary_analysis/**"
      - "tests/test_m14_binary_*.py"
      - "tools/ghidra/**"
  pull_request:
    paths:
      - ".github/workflows/m15-binary-regression-ci.yml"
      - "benchmarks/m15_blind/**"
      - "benchmarks/run_m15_binary_regression_gate.py"
      - "docs/milestones/m15-binary-static-precision.md"
      - "src/vulnhunt_agent/macos/binary_analysis/**"
      - "tests/test_m14_binary_*.py"
      - "tools/ghidra/**"

permissions:
  contents: read

concurrency:
  group: m15-binary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Blind binary regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Prepare test settings
        run: cp settings.example.toml settings.toml
      - name: Lint binary pipeline
        run: >-
          python -m ruff check
          src/vulnhunt_agent/macos/binary_analysis
          tests/test_m14_binary_*.py
          benchmarks/run_m15_binary_regression_gate.py
      - name: Type check binary pipeline
        run: >-
          python -m mypy
          src/vulnhunt_agent/macos/binary_analysis
          tests/test_m14_binary_*.py
          benchmarks/run_m15_binary_regression_gate.py
      - name: Run binary pipeline tests
        run: python -m pytest -q tests/test_m14_binary_*.py
      - name: Enforce blind regression policy
        run: >-
          python benchmarks/run_m15_binary_regression_gate.py
          --output m15-binary-regression-result.json
