[benchmark]
schema_version = 1
id = "m12-calibration-case-f521543734c7e34a"
oracle_policy = "blind-oracle-v1"

[source]
repository = "https://github.com/uriparser/uriparser.git"
commit = "f7230d6a0c1b12c9857cf8562a47e2f616713070"
tree = "debb9a4b0344600221370f65d3ce719581b9b9fc"

[scan]
environment = "c:gcc-13"
hunters = [
  "c-bounds-integers",
  "c-memory-lifetime",
  "c-parser-state",
  "c-injection-format",
  "c-concurrency-state",
  "c-error-contracts",
]

[policies]
signal_router = "c-signal-router-v4"
risk_chain = "c-risk-chain-v1"
cursor_access = "c-cursor-access-v1"
cursor_transition = "c-cursor-transition-v1"
cursor_proof = "c-cursor-proof-v1"
capacity_fact = "c-capacity-fact-v2"
capacity_summary = "c-capacity-summary-v2"
capacity_risk_chain = "c-capacity-risk-chain-v3"
slice_work = "c-slice-work-v4"
context = "c-context-v7"
admission = "c-budget-v11"
input_fairness = "work-input-fairness-v3"
evidence = "native-evidence-v2"
model_protocol = "strict-tool-json-v3"

[budget]
max_hunter_sessions = 12
max_input_tokens = 2000000
max_output_tokens = 200000
max_wall_clock_minutes = 60
max_retries_per_work_item = 1
max_format_repairs_per_work_item = 1

[limits]
max_target_signals_per_work = 6
max_context_bytes = 24000
max_parallel_hunters = 2
