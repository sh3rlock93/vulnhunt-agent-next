[oracle]
schema_version = 1
id = "cjson-issue-800"
upstream_reference = "DaveGamble/cJSON#800"
weakness = "bounded-input cursor advance causes a one-byte out-of-bounds read"

[fixed_source]
commit = "3ef4e4e730e5efd381be612df41e1ff3f5bb3c32"
tree = "3d1d654872dff42cfebca69133ef6acdf4354f2b"

[location]
entry_file = "cJSON.c"
entry_line_min = 1658
entry_line_max = 1672
sink_file = "cJSON.c"
sink_line_min = 780
sink_line_max = 795
required_paths = ["cJSON.c"]
required_hunter = "c-parser-state"
required_signal_category = "cursor_index_read"

[reproduction]
attempts = 2
timeout_seconds = 30
expected_vulnerable_failure = "heap-buffer-overflow"
expected_vulnerable_frame = "parse_string"
expected_fixed_stdout = "rejected"
source = '''
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include "cJSON.h"

int main(void) {
    static const char bytes[] = {'{', '"', '1', '"', ':', '1', ','};
    char *input = (char *)malloc(sizeof(bytes));
    cJSON *value;
    if (input == NULL) return 2;
    memcpy(input, bytes, sizeof(bytes));
    value = cJSON_ParseWithLength(input, sizeof(bytes));
    if (value != NULL) cJSON_Delete(value);
    free(input);
    puts("rejected");
    return 0;
}
'''
