[project]
name = "vulnhunt-agent"
version = "0.1.0"
description = "Vulnerability Hunting Agent — LLM-based scanner that reads, hypothesizes, and executes a PoC in a sandbox (PoC)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "openai>=1.50",
    "streamlit>=1.38",
    "streamlit-autorefresh>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnhunt_agent"]
