[project]
name = "vulnhunt-agent"
version = "0.1.0"
description = "Vulnerability Hunting Agent — LLM-based scanner that reads, hypothesizes, and executes a PoC in a sandbox (PoC)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "openai>=1.50",
    "pydantic>=2.10",
    "streamlit>=1.38",
    "streamlit-autorefresh>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
]

[project.scripts]
vulnhunt = "vulnhunt_agent.interfaces.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnhunt_agent"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.coverage.run]
branch = true
source = ["vulnhunt_agent"]
omit = [
    "src/vulnhunt_agent/_runner.py",
    "src/vulnhunt_agent/app.py",
    "src/vulnhunt_agent/ui/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/vulnhunt_agent/agents",
    "src/vulnhunt_agent/core",
    "src/vulnhunt_agent/domain",
    "src/vulnhunt_agent/indexer",
    "src/vulnhunt_agent/infrastructure",
    "src/vulnhunt_agent/interfaces",
    "src/vulnhunt_agent/pipeline",
    "src/vulnhunt_agent/prompts",
    "src/vulnhunt_agent/repo",
    "src/vulnhunt_agent/reporting",
    "src/vulnhunt_agent/sandbox",
    "tests",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
no_site_packages = true
