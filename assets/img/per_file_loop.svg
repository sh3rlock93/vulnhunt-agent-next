<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 540" width="100%">
  <defs>
    <marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <g transform="translate(10,220)">
    <text x="56" y="-10" text-anchor="middle" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="2">FILES</text>
    <g fill="#e5e7eb" stroke="#9ca3af">
      <rect x="0"   y="0"  width="20" height="14" rx="2"/>
      <rect x="23"  y="0"  width="20" height="14" rx="2"/>
      <rect x="46"  y="0"  width="20" height="14" rx="2"/>
      <rect x="69"  y="0"  width="20" height="14" rx="2"/>
      <rect x="92"  y="0"  width="20" height="14" rx="2"/>
      <rect x="0"   y="17" width="20" height="14" rx="2"/>
      <rect x="46"  y="17" width="20" height="14" rx="2"/>
      <rect x="69"  y="17" width="20" height="14" rx="2"/>
      <rect x="92"  y="17" width="20" height="14" rx="2"/>
      <rect x="0"   y="34" width="20" height="14" rx="2"/>
      <rect x="23"  y="34" width="20" height="14" rx="2"/>
      <rect x="46"  y="34" width="20" height="14" rx="2"/>
      <rect x="69"  y="34" width="20" height="14" rx="2"/>
      <rect x="92"  y="34" width="20" height="14" rx="2"/>
      <rect x="0"   y="51" width="20" height="14" rx="2"/>
      <rect x="23"  y="51" width="20" height="14" rx="2"/>
      <rect x="46"  y="51" width="20" height="14" rx="2"/>
      <rect x="69"  y="51" width="20" height="14" rx="2"/>
      <rect x="92"  y="51" width="20" height="14" rx="2"/>
    </g>
    <rect x="23" y="17" width="20" height="14" rx="2" fill="#fde8e3" stroke="#b91c1c" stroke-width="2"/>
  </g>

  <g transform="translate(10,108)">
    <rect x="0" y="0" width="112" height="46" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="56" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c" letter-spacing="2">ONE FILE</text>
    <text x="56" y="38" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#111827">target.py</text>
  </g>
  <polyline points="42,238 42,180 42,156" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arF)"/>
  <polyline points="122,131 138,131 138,280 152,280" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(154,80)">
    <rect x="0" y="0" width="220" height="400" rx="12" fill="#fde8e3" stroke="#b91c1c" stroke-width="2"/>
    <text x="110" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="2">PHASE A · HUNTER</text>
    <text x="110" y="44" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">independent session · fresh context</text>

    <g transform="translate(30,90)">
      <rect x="0" y="0" width="160" height="120" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>
      <text x="80" y="34" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Hunter</text>
      <line x1="20" y1="52" x2="140" y2="52" stroke="#fecaca"/>
      <text x="80" y="76" text-anchor="middle" font-size="11" fill="#374151">read</text>
      <text x="80" y="94" text-anchor="middle" font-size="11" fill="#374151">grep</text>
      <text x="80" y="112" text-anchor="middle" font-size="11" fill="#374151">exec PoC</text>
    </g>

    <text x="110" y="244" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">no shared history</text>
    <line x1="20" y1="268" x2="200" y2="268" stroke="#fecaca"/>
    <text x="110" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">"find"</text>
    <text x="110" y="316" text-anchor="middle" font-size="10" fill="#6b7280">→ findings[]</text>
  </g>

  <line x1="374" y1="280" x2="406" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(414,100)">
    <text x="60" y="0" text-anchor="middle" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="2">FINDINGS</text>
    <text x="60" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">raw, with overlap</text>
    <g>
      <circle cx="14"  cy="50"  r="7" fill="#dc2626"/>
      <circle cx="46"  cy="74"  r="7" fill="#dc2626"/>
      <circle cx="92"  cy="58"  r="7" fill="#dc2626"/>
      <circle cx="22"  cy="116" r="7" fill="#ea580c"/>
      <circle cx="74"  cy="130" r="7" fill="#ea580c"/>
      <circle cx="38"  cy="184" r="7" fill="#7c3aed"/>
      <circle cx="90"  cy="172" r="7" fill="#7c3aed"/>
      <circle cx="14"  cy="234" r="7" fill="#0d9488"/>
      <circle cx="62"  cy="226" r="7" fill="#0d9488"/>
      <circle cx="106" cy="240" r="7" fill="#0d9488"/>
      <circle cx="34"  cy="296" r="7" fill="#2563eb"/>
      <circle cx="92"  cy="304" r="7" fill="#2563eb"/>
    </g>
    <text x="60" y="354" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">12 — duplicates &amp; near-misses</text>
  </g>

  <line x1="540" y1="280" x2="568" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(576,200)">
    <rect x="0" y="0" width="116" height="160" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="58" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8" letter-spacing="2">PHASE B</text>
    <text x="58" y="44" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Clusterer</text>
    <text x="58" y="60" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">LLM × 1</text>
    <line x1="14" y1="74" x2="102" y2="74" stroke="#dbeafe"/>
    <text x="58" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">same sink</text>
    <text x="58" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">→ 1 group</text>
    <text x="58" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">"group"</text>
  </g>

  <line x1="692" y1="280" x2="720" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(728,100)">
    <text x="65" y="0" text-anchor="middle" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="2">GROUPS</text>
    <text x="65" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">deduped &amp; merged</text>

    <g transform="translate(0,32)">
      <rect x="0" y="0" width="130" height="52" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.4"/>
      <text x="8" y="14" font-size="9" font-weight="700" fill="#1d4ed8">g1</text>
      <circle cx="22" cy="32" r="6" fill="#dc2626"/>
      <circle cx="42" cy="32" r="6" fill="#dc2626"/>
      <circle cx="62" cy="32" r="6" fill="#dc2626"/>
      <circle cx="82" cy="32" r="6" fill="#0d9488"/>
      <text x="106" y="36" font-size="10" fill="#6b7280">×4</text>
    </g>
    <g transform="translate(0,98)">
      <rect x="0" y="0" width="130" height="52" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.4"/>
      <text x="8" y="14" font-size="9" font-weight="700" fill="#1d4ed8">g2</text>
      <circle cx="22" cy="32" r="6" fill="#ea580c"/>
      <circle cx="42" cy="32" r="6" fill="#ea580c"/>
      <text x="66" y="36" font-size="10" fill="#6b7280">×2</text>
    </g>
    <g transform="translate(0,164)">
      <rect x="0" y="0" width="130" height="52" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.4"/>
      <text x="8" y="14" font-size="9" font-weight="700" fill="#1d4ed8">g3</text>
      <circle cx="22" cy="32" r="6" fill="#7c3aed"/>
      <circle cx="42" cy="32" r="6" fill="#7c3aed"/>
      <circle cx="62" cy="32" r="6" fill="#2563eb"/>
      <circle cx="82" cy="32" r="6" fill="#2563eb"/>
      <circle cx="102" cy="32" r="6" fill="#0d9488"/>
      <text x="116" y="36" font-size="10" fill="#6b7280" font-style="italic">…</text>
    </g>
    <text x="65" y="246" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">3 groups</text>
  </g>

  <line x1="860" y1="280" x2="888" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(896,80)">
    <rect x="0" y="0" width="160" height="400" rx="12" fill="#fde8e3" stroke="#b91c1c" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="2">PHASE C</text>
    <text x="80" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Reviewer</text>
    <text x="80" y="68" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">× G · parallel</text>
    <line x1="20" y1="86" x2="140" y2="86" stroke="#fecaca"/>

    <g transform="translate(20,108)" font-size="11" fill="#374151">
      <text y="0" font-weight="700" fill="#b91c1c">re-run PoC</text>
      <text y="20" font-size="10" fill="#6b7280">verify in sandbox</text>
      <text y="48" font-weight="700" fill="#b91c1c">score CVSS</text>
      <text y="68" font-size="10" fill="#6b7280">severity</text>
      <text y="96" font-weight="700" fill="#b91c1c">confirm or drop</text>
      <text y="116" font-size="10" fill="#6b7280">finding ≠ confirmed</text>
    </g>

    <line x1="20" y1="252" x2="140" y2="252" stroke="#fecaca"/>
    <text x="80" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">"is it real?"</text>
    <text x="80" y="300" text-anchor="middle" font-size="10" fill="#6b7280">drops are OK</text>
    <text x="80" y="350" text-anchor="middle" font-size="10" fill="#6b7280">→ reports[]</text>
  </g>

  <line x1="1056" y1="280" x2="1084" y2="280" stroke="#374151" stroke-width="1.6" marker-end="url(#arF)"/>

  <g transform="translate(1092,100)">
    <text x="50" y="0" text-anchor="middle" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="2">REPORTS</text>
    <text x="50" y="14" text-anchor="middle" font-size="9" fill="#9ca3af">PoC + CVSS</text>

    <g transform="translate(0,32)">
      <rect x="0" y="0" width="100" height="60" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/>
      <text x="8" y="18" font-size="9" font-family="ui-monospace,monospace" fill="#b91c1c">report.json</text>
      <line x1="8" y1="26" x2="92" y2="26" stroke="#fecaca"/>
      <text x="8" y="42" font-size="10" fill="#374151">CVSS <tspan font-weight="800" fill="#b91c1c">9.1</tspan></text>
      <text x="8" y="55" font-size="9" fill="#6b7280">PoC ✓</text>
    </g>
    <g transform="translate(0,104)">
      <rect x="0" y="0" width="100" height="60" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1.4"/>
      <text x="8" y="18" font-size="9" font-family="ui-monospace,monospace" fill="#b91c1c">report.json</text>
      <line x1="8" y1="26" x2="92" y2="26" stroke="#fecaca"/>
      <text x="8" y="42" font-size="10" fill="#374151">CVSS <tspan font-weight="800" fill="#b91c1c">7.5</tspan></text>
      <text x="8" y="55" font-size="9" fill="#6b7280">PoC ✓</text>
    </g>
    <g transform="translate(0,176)">
      <rect x="0" y="0" width="100" height="46" rx="4" fill="#fafafa" stroke="#9ca3af" stroke-dasharray="3 3"/>
      <text x="8" y="18" font-size="9" font-family="ui-monospace,monospace" fill="#9ca3af">g3 → drop</text>
      <text x="8" y="34" font-size="9" fill="#9ca3af">PoC ✗</text>
    </g>
    <text x="50" y="244" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">2 confirmed</text>
    <text x="50" y="258" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">1 dropped</text>
  </g>

  <g transform="translate(150,500)">
    <rect x="0" y="0" width="1040" height="2" fill="#9ca3af"/>
    <text x="520" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" letter-spacing="2">— per file —</text>
  </g>
</svg>
